name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: console.cdx.json
          upload-artifact: false
          upload-release-assets: false   # the release step below attaches the SBOM (avoids a duplicate asset)

      - name: Extract this version's CHANGELOG section
        id: changelog
        # One moving v0.1.0: whatever sits under [Unreleased] when the tag moves is what ships, yet the
        # notes come from the [0.1.0] section. Fail rather than publish notes that omit it, and fail
        # rather than publish a stub when the section is missing.
        run: |
          version="${GITHUB_REF_NAME#v}"
          unreleased=$(awk '
            /^## \[Unreleased\]/ { f=1; next }
            f && /^## \[/ { exit }
            f && NF { print }
          ' CHANGELOG.md)
          if [ -n "$unreleased" ]; then
            echo "::error::CHANGELOG.md still has entries under [Unreleased]. With one moving tag they are what this release ships: fold them into [$version] before moving the tag." >&2
            exit 1
          fi
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $version; a release without real notes is incomplete." >&2
            exit 1
          fi
          {
            echo "body<<__CHANGELOG_EOF__"
            printf '%s\n' "$notes"
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/laranail/console/blob/main/CHANGELOG.md)."
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.body }}
          files: console.cdx.json
