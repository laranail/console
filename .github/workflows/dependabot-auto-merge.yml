name: Dependabot auto-merge

# Auto-merges green **patch & minor** Dependabot PRs; **major** bumps are left open
# for manual review. Merge happens via GitHub's native auto-merge, which waits for
# the branch-protection required checks to pass first.
#
# Requires (one-time repo settings):
#   - "Allow auto-merge" enabled        (Settings → General, or `gh api -X PATCH
#     repos/<owner>/<repo> -F allow_auto_merge=true`)
#   - branch-protection required checks that actually run (no stale contexts), so
#     auto-merge can resolve them.

on: pull_request_target

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch & minor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only Dependabot PRs. This job never checks out PR code, so pull_request_target
    # is safe here (no untrusted code runs with the write token).
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # The merge steps below call `gh pr merge --auto`, which GitHub refuses outright ("Auto merge
      # is not allowed for this repository") while the repository setting is off. That failed this
      # job on every Dependabot pull request and showed a red check on each one. Read the setting
      # first: when it is off, say so and leave the pull request for a person to merge.
      - name: Check that the repository allows auto-merge
        id: repo
        run: |
          allowed=$(gh api "repos/$REPO" --jq .allow_auto_merge)
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != "true" ]; then
            echo "::notice title=Auto-merge is off for this repository::Leaving $PR_URL for a manual merge. Enable 'Allow auto-merge' in the repository settings to have minor and patch updates merge themselves."
          fi
        env:
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch & minor updates
        if: ${{ steps.repo.outputs.allowed == 'true' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor') }}
        run: gh pr merge --auto --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
