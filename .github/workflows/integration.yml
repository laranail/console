name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real-app smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Create a fresh Laravel app
        run: composer create-project laravel/laravel:^13.0 app --no-interaction --prefer-dist

      - name: Require the package from a path repository
        working-directory: app
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config repositories.laranail-console '{"type":"path","url":"../package","options":{"symlink":true}}'
          composer require "laranail/console:@dev" --no-interaction --with-all-dependencies

      - name: End-to-end checks in the real app
        working-directory: app
        run: |
          set -e
          # config publishes
          # The tag is vendor-scoped. It stopped being the bare `console-config` when the family
          # namespaced its publish tags in August, and this step kept asking for the old one --
          # vendor:publish reports "No publishable resources" and exits 0, so the failure only
          # surfaced on the `test -f` below, with nothing naming the cause.
          php artisan vendor:publish --tag=laranail::console-config --no-interaction
          # Nested, not flat. The config key is dotted (laranail.console), and Laravel reads a
          # published override back from the matching nested path -- a flat config/console.php would
          # load as config('console') and be invisible to the merged key.
          test -f config/laranail/console.php

          # And the lang tag, which nothing exercised at all.
          php artisan vendor:publish --tag=laranail::console-lang --no-interaction
          # the namespaced "::" command is registered + dispatches in a real Artisan kernel
          php artisan list | grep -q 'laranail::console.check'
          out=$(php artisan laranail::console.check)
          echo "$out"
          echo "$out" | grep -q 'configuration is valid'
